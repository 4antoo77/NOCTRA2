<script>
(function(){
  var path=location.pathname;
  if(path.startsWith('/antoopelis/')){
    var target=new URL('/antoopelis/',location.origin);
    target.searchParams.set('__route',path+location.search+location.hash);
    location.replace(target.href);
  }else{
    location.replace('/');
  }
})();
</script>
