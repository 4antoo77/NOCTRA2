<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0a090f;color:#f4ecff;font:16px system-ui;text-align:center;padding:16px">
  <p>Abriendo ANTOO PELIS…</p>
  <script>
    (function(){
      // GitHub Pages serves 404.html for deep SPA paths. Keep the route in
      // the query for the landing page to restore without losing the URL.
      var url=new URL('/',location.origin);
      url.searchParams.set('__route',location.pathname+location.search+location.hash);
      location.replace(url.toString());
    })();
  </script>
  <noscript>Activa JavaScript y visita <a style="color:#caaaff" href="/">ANTOO PELIS</a>.</noscript>
</body>
